<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Quiz</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to right, #00c6ff, #0072ff);
            color: white;
            height: 100vh; /* Full height */
            display: flex;
            flex-direction: column;
        }
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px; /* Add padding for better spacing */
        }
        .form-control {
            background-color: rgba(255, 255, 255, 0.1); /* Semi-transparent background for inputs */
            color: white; /* Text color */
        }
        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.7); /* Placeholder color */
        }
        .form-group label {
            color: white; /* Label color */
        }
        .btn-primary {
            background-color: #007bff; /* Primary button color */
            border-color: #007bff; /* Primary button border color */
        }
        .btn-secondary {
            background-color: #6c757d; /* Secondary button color */
            border-color: #6c757d; /* Secondary button border color */
        }
        .form-check-input {
            accent-color: #007bff; /* Color of the radio button */
        }
        .top-buttons {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>
        <!-- Logout and Back to Dashboard Buttons -->
        <div class="top-buttons">
            <a href="/logout/" class="btn btn-danger btn-sm">
                <i class="fas fa-sign-out-alt"></i> Logout
            </a>
            <a href="/teacher_dashboard/" class="btn btn-secondary btn-sm">
                <i class="fas fa-home"></i> Main Dashboard
            </a>
            <a href="/classes/class_dashboard/{{ class_code }}/" class="btn btn-info btn-sm">
                <i class="fas fa-chalkboard"></i> Class Dashboard
            </a>
        </div>
    
    <div class="container">
        <h1>Create Quiz</h1>
        <form id="quizForm" method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="title">Quiz Title</label>
                <input type="text" class="form-control" id="title" name="title" required>
                <label for="time_limit">Time Limit (in minutes)</label>
                <input type="number" class="form-control" id="time_limit" name="time_limit" min="0" required>
            </div>

            <!-- Questions Container -->
            <div id="questionsContainer">
                <div class="question">
                    <div class="form-group">
                        
                        <label>Question 1</label>
                        <input type="text" class="form-control" name="question_text[]" required>
                        <input type="number" class="form-control mt-2" name="question_points[]" placeholder="Points" min="1" required>
                    </div>
                    <!-- Options -->
                    <div class="options">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="is_correct_0" value="0" required>
                            <input type="text" class="form-control mb-2" name="option_text[]" placeholder="Option 1" required>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="is_correct_0" value="1">
                            <input type="text" class="form-control mb-2" name="option_text[]" placeholder="Option 2" required>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="is_correct_0" value="2">
                            <input type="text" class="form-control mb-2" name="option_text[]" placeholder="Option 3" required>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="is_correct_0" value="3">
                            <input type="text" class="form-control mb-2" name="option_text[]" placeholder="Option 4" required>
                        </div>
                    </div>
                </div>
            </div>

            <button type="button" class="btn btn-secondary" id="addQuestion">Add Question</button>
            <button type="submit" class="btn btn-primary">Create Quiz</button>
        </form>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script>
        $(document).ready(function() {
            let questionCount = 1;

            // Add Question Button
            $('#addQuestion').click(function() {
                questionCount++;
                const newQuestion = `
                    <div class="question mt-4">
                        <div class="form-group">
                            <label>Question ${questionCount}</label>
                            <input type="text" class="form-control" name="question_text[]" required>
                            <input type="number" class="form-control mt-2" name="question_points[]" placeholder="Points" min="1" required>
                        </div>
                        <div class="options">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="is_correct_${questionCount-1}" value="0" required>
                                <input type="text" class="form-control mb-2" name="option_text[]" placeholder="Option 1" required>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="is_correct_${questionCount-1}" value="1">
                                <input type="text" class="form-control mb-2" name="option_text[]" placeholder="Option 2" required>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="is_correct_${questionCount-1}" value="2">
                                <input type="text" class="form-control mb-2" name="option_text[]" placeholder="Option 3" required>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="is_correct_${questionCount-1}" value="3">
                                <input type="text" class="form-control mb-2" name="option_text[]" placeholder="Option 4" required>
                            </div>
                        </div>
                    </div>
                `;
                $('#questionsContainer').append(newQuestion);
            });

          
            // Create Quiz Form Submission
            $('#quizForm').on('submit', function(event) {
                event.preventDefault();
                var formData = $(this).serialize();
                
                $.ajax({
                    url: window.location.href,
                    method: 'POST',
                    data: formData,
                    success: function(response) {
                        window.location.href = "/classes/view_quizzes/{{ class_code }}/ ";
                    },
                    error: function(xhr) {
                        alert('Error: ' + xhr.responseJSON?.error || 'Something went wrong');
                    }
                });
            });
        });
    </script>
</body>
</html>

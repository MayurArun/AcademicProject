<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Result</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to right, #00c6ff, #0072ff);
            color: white;
            height: 100vh; /* Full height */
            display: flex;
            flex-direction: column;
        }
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px; /* Add padding for better spacing */
        }
        .alert {
            background-color: rgba(255, 255, 255, 0.1); /* Semi-transparent background for alerts */
            border-color: rgba(255, 255, 255, 0.3); /* Lighter border for alerts */
            color: white; /* Text color */
        }
        h1, h4, p {
            color: white; /* Heading and text color */
        }
        .top-buttons {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 10px;
        }
        .btn-warning {
            background-color: #ffc107; /* Warning button color */
            border-color: #ffc107; /* Warning button border color */
        }
        .btn-info {
            background-color: #17a2b8; /* Info button color */
            border-color: #17a2b8; /* Info button border color */
        }
    </style>
</head>
<body>
    <!-- Top Buttons: Logout, Main Dashboard, and Class Dashboard -->
    <div class="top-buttons">
        <a href="/logout/" class="btn btn-danger btn-sm">
            <i class="fas fa-sign-out-alt"></i> Logout
        </a>
        <a href="/student_dashboard/" class="btn btn-warning btn-sm">
            <i class="fas fa-home"></i> Main Dashboard
        </a>
        <a href="/classes/class_dashboard/{{ submission.quiz.class_obj.class_code }}/" class="btn btn-info btn-sm">
            <i class="fas fa-chalkboard"></i> Class Dashboard
        </a>
    </div>

    <div class="container">
        <h1>Your Grade for {{ submission.quiz.title }}</h1>
        <div class="alert alert-info">
            <h4>Score: {{ submission.score }}</h4>
            <p>Submitted at: {{ submission.submitted_at }}</p>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>

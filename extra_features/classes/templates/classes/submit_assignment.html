<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Submit Assignment</title>
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
        <style>
            body {
                margin: 0;
                font-family: 'Arial', sans-serif;
                background: linear-gradient(to right, #00c6ff, #0072ff);
                color: white;
                height: 100vh; /* Full height */
                display: flex;
                flex-direction: column;
            }
            .container {
                flex: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                text-align: center;
            }
            h1 {
                color: white; /* Heading color */
            }
            .btn-primary {
                background-color: #007bff; /* Primary button color */
                border-color: #007bff; /* Primary button border color */
            }
            .form-control {
                background-color: rgba(255, 255, 255, 0.1); /* Semi-transparent background for inputs */
                color: white; /* Text color */
            }
            .form-control::placeholder {
                color: rgba(255, 255, 255, 0.7); /* Placeholder color */
            }
            .form-group label {
                color: white; /* Label color */
            }
            .footer {
                position: fixed;
                bottom: 10px;
                left: 10px;
                color: white;
            }
            .top-buttons {
                position: absolute;
                top: 10px;
                right: 10px;
                display: flex;
                gap: 10px;
            }
        </style>
    </head>
<body>
        <!-- Logout and Back to Dashboard Buttons -->
        <div class="top-buttons">
            <a href="/logout/" class="btn btn-danger btn-sm">
                <i class="fas fa-sign-out-alt"></i> Logout
            </a>
            <a href="/class_dashboard/" class="btn btn-secondary btn-sm">
                <i class="fas fa-home"></i> Main Dashboard
            </a>
            <a href="/classes/class_dashboard/{{ class_code }}/" class="btn btn-info btn-sm">
                <i class="fas fa-chalkboard"></i> Class Dashboard
            </a>
        </div>
    
    <div class="container">
        <h1>Submit Assignment</h1>
        <form id="submitAssignmentForm" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-group">
                <label for="text">Text</label>
                <textarea class="form-control" id="text" name="text" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label for="files">Files</label>
                <input type="file" class="form-control" id="files" name="files" multiple>
            </div>
            <button type="submit" class="btn btn-primary">Submit Assignment</button>
        </form>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#submitAssignmentForm').on('submit', function(event) {
                event.preventDefault();
                var formData = new FormData(this);
                $.ajax({
                    url: '/classes/submit_assignment/{{ assignment_id }}/',
                    method: 'POST',
                    data: formData,
                    processData: false,
                    contentType: false,
                    success: function(response) {
                        if (response.status === 'success') {
                            alert('Assignment submitted successfully.');
                            window.location.href = '/classes/view_assignments/{{ class_code }}/';  // Use class_code here
                        } else {
                            alert('An error occurred. Please try again.');
                        }
                    },
                    error: function() {
                        alert('An error occurred. Please try again.');
                    }
                });
            });
        });
    </script>
</body>
</html>

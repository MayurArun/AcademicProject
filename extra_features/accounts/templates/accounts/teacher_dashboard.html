<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to right, #00c6ff, #0072ff);
            color: white;
            height: 100vh; /* Full height */
            overflow: hidden; /* Prevent scrolling */
            display: flex;
            flex-direction: column;
        }
        .navbar {
            background-color: rgba(0, 0, 0, 0.8); /* Dark background for navbar */
        }
        .navbar-brand {
            color: white !important; /* Set Classroom text to white */
        }
        .logout-button {
            position: absolute;
            top: 10px;
            right: 10px;
        }
        .class-box {
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            background-color: rgba(255, 255, 255, 0.2); /* Darker semi-transparent white */
            color: white; /* Text color */
        }
        .btn-primary {
            background-color: #007bff; /* Primary button color */
            border-color: #007bff; /* Primary button border color */
            margin-top: 20px; /* Add margin to create space from navbar */
        }
        .btn-secondary {
            background-color: #007bff; /* Same color as Create Class button */
            border-color: #007bff; /* Same border color */
        }
        h1, h2 {
            color: white; /* Heading color */
        }
        .footer {
            position: fixed;
            bottom: 10px;
            left: 10px;
            color: white;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light">
        <a class="navbar-brand" href="#">Teacher Dashboard</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a href="/logout/" class="btn btn-danger btn-sm logout-button">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <a href="http://127.0.0.1:5000/add-course" class="btn btn-primary">Add Course</a>
        <a href="/classes/create_class/" class="btn btn-primary"><i class="fas fa-plus-circle"></i> Create New Class</a>
        <h2 style="margin-top: 20px;">Classes</h2>
        <div class="row">
            {% for class in classes %}
                <div class="col-md-4">
                    <div class="class-box">
                        <h4>{{ class.name }}</h4>
                        <p>{{ class.section }}</p>
                        <p>{{ class.description }}</p>
                        <a href="/classes/class_dashboard/{{ class.class_code }}/" class="btn btn-secondary"><i class="fas fa-chalkboard"></i> View Class</a>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>



    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>

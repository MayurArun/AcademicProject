<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to right, #00c6ff, #0072ff);
            color: white;
            height: 100vh; /* Full height */
            overflow: hidden; /* Prevent scrolling */
            display: flex;
            flex-direction: column;
        }
        .hero {
            display: fixed;
            height: 100%; /* Full height */
            align-items: center;
            justify-content: center;
            text-align: center;
            animation: fadeIn 1s ease-in-out;
        }
        .hero img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            transition: transform 0.3s;
        }
        .hero img:hover {
            transform: scale(1.05);
        }
        .welcome-text {
            padding: 20px;

        }
        .navbar {
            background-color: rgba(0, 0, 0, 0.8);
        }
        .navbar-brand {
            color: white !important; /* Set Classroom text to white */
        }
        .nav-link {
            color: white !important;
            text-align: center; /* Center the text */
        }
        .nav-link:hover {
            color: #ffdd57 !important;
        }
        .footer {
            position: fixed;
            bottom: 10px;
            left: 10px;
            color: white;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light">
        <a class="navbar-brand">Classroom</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link" href="#" data-toggle="collapse" data-target="#loginRegisterMenu">Menu</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href=" http://127.0.0.1:5000" >back</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="collapse" id="loginRegisterMenu">
        <div class="bg-dark p-3 text-center"> <!-- Center the text -->
            <a class="nav-link text-white" href="/login/">Login</a>
        </div>
    </div>

    <div class="hero">
        <div class="row w-100">
            <div class="col-md-6 welcome-text">
                <h1>Welcome to Classroom</h1>
                <p>Your journey to knowledge starts here. Join us today!</p>

            </div>
        </div>
    </div>



    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
